name     = "LowFoldIn"
version  = "0.1.0"
author   = "Nathanael Nardoto Batsita"

[build]
auto-executables = true
link = ["lapack", "blas"]

[[executable]]
name       = "openmx2hsio"
source-dir = "tools"
main       = "openmx2hsio.f90"

# ==============================================================================
# CONFIGURAÇÃO MODERNA DE COMPILAÇÃO (FPM 0.13+)
# ==============================================================================

[features]
meus_flags.flags = "-std=f2023 -O3 -Wall -Wextra -fcheck=all -fopenmp"
